name: Monitor citas EMTRA

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba_correo:
        description: "Enviar correo de prueba"
        type: boolean
        default: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache/restore@v4
        with:
          path: notificados.json
          key: notificados-${{ github.run_id }}
          restore-keys: notificados-

      - name: Revisar citas
        run: dotnet run -c Release
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SOLO_DIAS: sabado
          PRUEBA_CORREO: ${{ inputs.prueba_correo }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('notificados.json') != ''
        with:
          path: notificados.json
          key: notificados-${{ github.run_id }}
